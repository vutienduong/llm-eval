[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "Lightweight LLM and agent evaluation pipeline for incident triage workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
llm-eval = "run_eval:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

