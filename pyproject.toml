[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "Lightweight LLM and agent evaluation pipeline for incident triage workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
judge-deepeval = [
  "deepeval>=1.4.0",
]

[project.scripts]
llm-eval = "run_eval:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "agent_runner",
  "integrations",
  "judge_model",
  "metrics",
  "models",
  "reporting",
  "run_eval",
  "test_case_loader",
]
